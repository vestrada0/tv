<!doctype html>
<title>Living Room Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: 16:9 TV canvas. Clock owns the left, current weather the right, a 5-day strip along the bottom. */
:root {
  --ink: #0f1526;
  --ink-raised: #172038;
  --line: #26304d;
  --sky: #e8edf7;
  --dusk: #9aa6c2;
  --peach: #f4b58c;
  --rain: #7fb3e6;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--sky);
  font-family: var(--body);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage {
  height: 100%;
  box-sizing: border-box;
  padding-block: 5vh;
  padding-inline: 4vw;
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  grid-template-rows: 1fr auto;
  gap: 4vh 5vw;
  transition: opacity 2s ease, transform 3s ease;
}
.stage.night { opacity: .42; }

.clock { display: flex; flex-direction: column; justify-content: center; gap: 1.6vh; min-width: 0; }
.greeting { font-size: 2.4vw; color: var(--peach); font-weight: 500; }
.time {
  font-family: var(--display);
  font-weight: 300;
  font-size: 15vw;
  line-height: .9;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; gap: 1.2vw;
}
.time .ampm { font-size: 3vw; font-weight: 500; color: var(--dusk); letter-spacing: .04em; }
.date { font-size: 2.6vw; color: var(--dusk); font-weight: 500; }

.now {
  align-self: center;
  background: var(--ink-raised);
  border: 1px solid var(--line);
  border-radius: 2.2vw;
  padding: 4vh 2.6vw;
  display: grid;
  gap: 2vh;
  min-width: 0;
}
.label { font-size: 1.15vw; letter-spacing: .14em; text-transform: uppercase; color: var(--dusk); font-weight: 600; }
.now-main { display: flex; align-items: center; gap: 1.6vw; }
.now-main svg { width: 7vw; height: 7vw; flex: none; }
.temp { font-family: var(--display); font-size: 8vw; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.cond { font-size: 2.2vw; font-weight: 500; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1vw; border-top: 1px solid var(--line); padding-top: 2vh; }
.fact span { display: block; }
.fact .k { font-size: 1.05vw; color: var(--dusk); letter-spacing: .08em; text-transform: uppercase; }
.fact .v { font-size: 1.9vw; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: .4vh; }

.week {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--line);
  padding-top: 3vh;
}
.day { display: grid; justify-items: start; gap: .8vh; padding-inline: 1.2vw; border-left: 1px solid var(--line); }
.day:first-child { border-left: 0; padding-left: 0; }
.day .dn { font-size: 1.5vw; font-weight: 600; }
.day svg { width: 3.4vw; height: 3.4vw; }
.day .hl { font-family: var(--display); font-size: 2.2vw; font-variant-numeric: tabular-nums; }
.day .hl small { color: var(--dusk); font-size: .7em; margin-left: .5vw; }
.day .pop { font-size: 1.2vw; color: var(--rain); min-height: 1.4em; }

.note { position: fixed; right: max(2vw, env(safe-area-inset-right, 0px)); bottom: max(1.5vh, env(safe-area-inset-bottom, 0px)); font-size: .95vw; color: var(--dusk); opacity: .7; }

svg .sun { fill: var(--peach); }
svg .cloud { fill: var(--sky); opacity: .9; }
svg .drop { stroke: var(--rain); stroke-width: 5; stroke-linecap: round; fill: none; }
svg .bolt { fill: var(--peach); }
svg .flake { fill: var(--sky); }
svg .fog { stroke: var(--dusk); stroke-width: 5; stroke-linecap: round; }

@media (max-width: 760px), (orientation: portrait) {
  body { overflow: auto; }
  .stage { grid-template-columns: 1fr; height: auto; padding-inline: 0; gap: 4vh; }
  .greeting { font-size: 1.2rem; }
  .time { font-size: 5.5rem; }
  .time .ampm { font-size: 1.2rem; }
  .date { font-size: 1.2rem; }
  .now { border-radius: 18px; padding: 20px; }
  .label { font-size: .75rem; }
  .now-main svg { width: 72px; height: 72px; }
  .temp { font-size: 3.6rem; }
  .cond { font-size: 1.15rem; }
  .fact .k { font-size: .7rem; }
  .fact .v { font-size: 1.1rem; }
  .week { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .day { padding-inline: 6px; }
  .day .dn { font-size: .85rem; }
  .day svg { width: 32px; height: 32px; }
  .day .hl { font-size: 1.05rem; }
  .day .hl small { display: block; margin: 0; }
  .day .pop { font-size: .75rem; }
  .note { position: static; display: block; font-size: .75rem; padding-bottom: 16px; }
}
@media (prefers-reduced-motion: reduce) { .stage { transition: none; } }
</style>

<main class="stage" id="stage">
  <section class="clock" aria-label="Time and date">
    <div class="greeting" id="greeting">Good evening</div>
    <div class="time"><span id="hm">8:30</span><span class="ampm" id="ampm">PM</span></div>
    <div class="date" id="date">Tuesday, October 20</div>
  </section>

  <section class="now" aria-label="Current weather">
    <div class="label">Mansfield, TX · now</div>
    <div class="now-main">
      <span id="nowIcon"></span>
      <div>
        <div class="temp" id="nowTemp">--°</div>
        <div class="cond" id="nowCond">Loading weather</div>
      </div>
    </div>
    <div class="facts">
      <div class="fact"><span class="k">High / Low</span><span class="v" id="hilo">--</span></div>
      <div class="fact"><span class="k">Feels like</span><span class="v" id="feels">--</span></div>
      <div class="fact"><span class="k" id="sunLabel">Sunset</span><span class="v" id="sun">--</span></div>
    </div>
  </section>

  <section class="week" id="week" aria-label="Five day forecast"></section>
</main>
<div class="note" id="note">Weather by Open-Meteo</div>

<script>
const LAT = 32.5632, LON = -97.1417, TZ = "America/Chicago";

const ICONS = {
  sun: '<circle class="sun" cx="50" cy="50" r="20"/><g class="sun">' + [0,45,90,135,180,225,270,315].map(a => `<rect x="47" y="8" width="6" height="14" rx="3" transform="rotate(${a} 50 50)"/>`).join("") + '</g>',
  partly: '<circle class="sun" cx="38" cy="38" r="16"/><path class="cloud" d="M30 78h44a16 16 0 0 0 0-32 22 22 0 0 0-42 6 13 13 0 0 0-2 26z"/>',
  cloud: '<path class="cloud" d="M24 74h52a18 18 0 0 0 0-36 24 24 0 0 0-46 7 15 15 0 0 0-6 29z"/>',
  rain: '<path class="cloud" d="M24 60h52a17 17 0 0 0 0-34 23 23 0 0 0-44 7 14 14 0 0 0-8 27z"/><path class="drop" d="M36 70l-4 12M52 70l-4 12M68 70l-4 12"/>',
  storm: '<path class="cloud" d="M24 58h52a17 17 0 0 0 0-34 23 23 0 0 0-44 7 14 14 0 0 0-8 27z"/><path class="bolt" d="M52 60L40 80h10l-4 14 16-22H52l6-12z"/>',
  snow: '<path class="cloud" d="M24 60h52a17 17 0 0 0 0-34 23 23 0 0 0-44 7 14 14 0 0 0-8 27z"/><circle class="flake" cx="36" cy="76" r="4"/><circle class="flake" cx="52" cy="82" r="4"/><circle class="flake" cx="68" cy="76" r="4"/>',
  fog: '<path class="cloud" d="M24 52h52a17 17 0 0 0 0-34 23 23 0 0 0-44 7 14 14 0 0 0-8 27z"/><path class="fog" d="M22 66h56M30 80h44"/>'
};
const icon = k => `<svg viewBox="0 0 100 100" aria-hidden="true">${ICONS[k]}</svg>`;

function describe(code) {
  if (code === 0) return ["sun", "Clear"];
  if (code === 1) return ["sun", "Mostly clear"];
  if (code === 2) return ["partly", "Partly cloudy"];
  if (code === 3) return ["cloud", "Cloudy"];
  if (code === 45 || code === 48) return ["fog", "Foggy"];
  if (code >= 51 && code <= 57) return ["rain", "Drizzle"];
  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return ["rain", code >= 65 && code !== 80 ? "Heavy rain" : "Rain"];
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ["snow", "Snow"];
  if (code >= 95) return ["storm", "Thunderstorms"];
  return ["cloud", "Cloudy"];
}

const fmtTime = iso => new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ });

function tick() {
  const d = new Date();
  const h = d.getHours();
  const parts = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).split(" ");
  document.getElementById("hm").textContent = parts[0];
  document.getElementById("ampm").textContent = parts[1] || "";
  document.getElementById("date").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  document.getElementById("greeting").textContent =
    h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 22 ? "Good evening" : "Good night";
  const stage = document.getElementById("stage");
  stage.classList.toggle("night", h >= 22 || h < 6);
  // Shift a few pixels each minute so nothing burns into the screen.
  const m = d.getMinutes();
  stage.style.transform = `translate(${(m % 5) - 2}px, ${(Math.floor(m / 5) % 5) - 2}px)`;
}

function render(w, isSample) {
  const c = w.current, dl = w.daily;
  const [k, txt] = describe(c.weather_code);
  document.getElementById("nowIcon").innerHTML = icon(k);
  document.getElementById("nowTemp").textContent = Math.round(c.temperature_2m) + "°";
  document.getElementById("nowCond").textContent = txt;
  document.getElementById("hilo").textContent = `${Math.round(dl.temperature_2m_max[0])}° / ${Math.round(dl.temperature_2m_min[0])}°`;
  document.getElementById("feels").textContent = Math.round(c.apparent_temperature) + "°";
  const now = Date.now();
  const sunsetPassed = new Date(dl.sunset[0]).getTime() < now;
  document.getElementById("sunLabel").textContent = sunsetPassed ? "Sunrise" : "Sunset";
  document.getElementById("sun").textContent = fmtTime(sunsetPassed ? dl.sunrise[1] : dl.sunset[0]);

  document.getElementById("week").innerHTML = dl.time.slice(0, 5).map((t, i) => {
    const [dk] = describe(dl.weather_code[i]);
    const name = i === 0 ? "Today" : new Date(t + "T12:00:00").toLocaleDateString("en-US", { weekday: "short" });
    const pop = dl.precipitation_probability_max[i];
    return `<div class="day"><div class="dn">${name}</div>${icon(dk)}
      <div class="hl">${Math.round(dl.temperature_2m_max[i])}°<small>${Math.round(dl.temperature_2m_min[i])}°</small></div>
      <div class="pop">${pop >= 20 ? pop + "% rain" : ""}</div></div>`;
  }).join("");
  document.getElementById("note").textContent = isSample
    ? "Sample weather shown here. Live weather loads on the TV."
    : "Weather by Open-Meteo · updated " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

function sample() {
  const base = new Date(); const day = i => { const d = new Date(base); d.setDate(d.getDate() + i); return d.toISOString().slice(0, 10); };
  return {
    current: { temperature_2m: 71, apparent_temperature: 70, weather_code: 1 },
    daily: {
      time: [0,1,2,3,4].map(day),
      weather_code: [1, 2, 61, 3, 0],
      temperature_2m_max: [82, 79, 72, 75, 80],
      temperature_2m_min: [61, 60, 57, 55, 58],
      precipitation_probability_max: [5, 10, 60, 15, 0],
      sunrise: [day(0) + "T07:31", day(1) + "T07:32"],
      sunset: [day(0) + "T18:52", day(1) + "T18:51"]
    }
  };
}

let haveLive = false;
async function loadWeather() {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
    `&current=temperature_2m,apparent_temperature,weather_code` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset` +
    `&temperature_unit=fahrenheit&timezone=${encodeURIComponent(TZ)}&forecast_days=6`;
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    render(await r.json(), false);
    haveLive = true;
  } catch (e) {
    if (!haveLive) render(sample(), true);
  }
}

tick();
setInterval(tick, 1000);
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);
// Reload every 6 hours to pick up dashboard changes.
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
</script>
